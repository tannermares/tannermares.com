<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#120a2b" />
      <stop offset="0.55" stop-color="#2b0f54" />
      <stop offset="0.72" stop-color="#5a1466" />
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd23f" />
      <stop offset="0.5" stop-color="#ff7a3d" />
      <stop offset="1" stop-color="#ff2e88" />
    </linearGradient>
    <mask id="bands">
      <rect width="64" height="64" fill="#fff" />
      <rect x="0" y="31" width="64" height="2" fill="#000" />
      <rect x="0" y="36" width="64" height="2.5" fill="#000" />
      <rect x="0" y="41" width="64" height="3" fill="#000" />
    </mask>
    <clipPath id="tile">
      <rect width="64" height="64" rx="14" />
    </clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="64" height="64" fill="url(#sky)" />
    <circle cx="32" cy="38" r="22" fill="url(#sun)" mask="url(#bands)" />
    <rect x="0" y="46" width="64" height="18" fill="#120a2b" />
    <g stroke="#ff2e88" stroke-width="1.5" opacity="0.85">
      <line x1="32" y1="46" x2="32" y2="64" />
      <line x1="24" y1="46" x2="10" y2="64" />
      <line x1="40" y1="46" x2="54" y2="64" />
      <line x1="16" y1="46" x2="-12" y2="64" />
      <line x1="48" y1="46" x2="76" y2="64" />
      <line x1="0" y1="53" x2="64" y2="53" />
    </g>
    <rect x="0" y="45" width="64" height="2.5" fill="#ff2e88" />
  </g>
</svg>
